apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/pandalapadu/argocd.git
    targetRevision: main
    path: namespaces

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
  automated:
    prune: true  # Automatically delete resources that are no longer defined in the Git repository.
    selfHeal: true