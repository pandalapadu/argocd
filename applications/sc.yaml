apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: namespaces
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/pandalapadu/argocd.git
    targetRevision: main
    path: storage-classes

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true     # This will delete resources that are no longer defined in the Git repository.
      selfHeal: true   # This will automatically apply changes made to the resources in the Git repository.