# A secure approach: Reference a pre-existing secret rather than hardcoding it
apiVersion: v1
kind: Secret
metadata:
  name: github-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
data:
  # Values must be base64 encoded strings, NOT plaintext raw text variables
  username: bXktZ2l0aHViLXVzZXJuYW1l
  password: ZXlKMGVYQWlPaUpLVjFRaUxDSmhiR2NpT2lKSVV6ST...
